<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F7FF">
<title>Jules English Adventure</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F7FF; --grid:#D9E6FB; --ink:#1C2B5A; --ink2:#5A6890;
  --sky:#3D7BF7; --sky-d:#2357C9; --sun:#FFC83D; --sun-d:#B98000;
  --leaf:#1FA36A; --leaf-l:#DDF6EA; --tomato:#E8573A; --tomato-l:#FDE6E0;
  --card:#FFFFFF; --stone:#C9D6EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Baloo 2',ui-rounded,system-ui,sans-serif;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;-webkit-user-select:none;user-select:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.screen{display:none;min-height:100vh;padding:16px 18px 40px;max-width:900px;margin:0 auto}
.screen.active{display:block}

/* Barre du haut */
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hello{font-size:34px;font-weight:800;line-height:1.1;margin:0;flex:1}
.hello small{display:block;font-size:17px;font-weight:500;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--ink);
  border-radius:16px;padding:6px 12px;font-size:20px;font-weight:700;box-shadow:0 4px 0 var(--ink)}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip.star{background:var(--sun)}
.icon-btn{width:52px;height:52px;justify-content:center;padding:0}

/* Carte d'aventure */
#map{position:relative;margin-top:10px}
#map svg{position:absolute;inset:0;pointer-events:none}
.stone{position:absolute;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;
  background:var(--card);border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);font-size:46px;
  display:flex;align-items:center;justify-content:center}
.stone:active{transform:translate(-50%,calc(-50% + 5px));box-shadow:0 2px 0 var(--ink)}
.stone.done{background:var(--leaf-l)}
.stone.locked{background:var(--stone);border-color:#8A98B8;box-shadow:0 7px 0 #8A98B8;filter:grayscale(1);font-size:38px}
.stone.current::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:4px dashed var(--sky);
  animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stone-cap{position:absolute;transform:translateX(-50%);text-align:center;width:150px;line-height:1.1;pointer-events:none}
.stone-cap b{display:block;font-size:19px}
.stone-cap span{font-size:22px;letter-spacing:2px;color:var(--sun-d)}
.banner{position:absolute;transform:translateY(-50%);background:var(--sky);color:#fff;border-radius:14px;
  padding:8px 14px;max-width:42%;box-shadow:0 5px 0 var(--sky-d);line-height:1.15}
.banner b{display:block;font-size:20px}
.banner small{font-size:15px;opacity:.9}

/* Jeu */
.game-top{display:flex;align-items:center;gap:12px}
.dots{flex:1;display:flex;gap:6px;flex-wrap:wrap}
.dot{flex:1;min-width:14px;height:14px;border-radius:7px;background:var(--card);border:3px solid var(--ink)}
.dot.ok{background:var(--leaf)} .dot.ko{background:var(--tomato)} .dot.now{background:var(--sun)}
.picto-card{margin:22px auto 10px;width:min(320px,70vw);aspect-ratio:1;background:var(--card);border:4px solid var(--ink);
  border-radius:36px;box-shadow:0 10px 0 var(--ink);display:flex;align-items:center;justify-content:center;
  font-size:min(170px,36vw);line-height:1}
.picto-card.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.7) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.question{text-align:center;font-size:26px;font-weight:700;margin:8px 0 14px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.opt{background:var(--card);border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);
  font-size:34px;font-weight:700;padding:14px 10px;min-height:84px}
.opt:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.opt.ok{background:var(--leaf);color:#fff} .opt.ko{background:var(--tomato);color:#fff}
.opt.dim{opacity:.45}
.write-row{display:flex;gap:12px;max-width:600px;margin:0 auto}
.write-row input{flex:1;min-width:0;font-family:inherit;font-size:36px;font-weight:700;color:var(--ink);text-align:center;
  background:var(--card);border:4px solid var(--ink);border-radius:22px;padding:8px 12px;box-shadow:inset 0 4px 0 #E8EEF9}
.write-row input.ok{border-color:var(--leaf);background:var(--leaf-l)}
.write-row input.ko{border-color:var(--tomato);background:var(--tomato-l)}
.big-btn{background:var(--sky);color:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);
  font-size:28px;font-weight:800;padding:10px 24px}
.big-btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.big-btn.green{background:var(--leaf)} .big-btn.light{background:var(--card);color:var(--ink)}
.hint{text-align:center;font-size:30px;letter-spacing:8px;font-weight:700;min-height:44px;margin-top:10px;color:var(--sky-d)}
.err{text-align:center;color:var(--tomato);font-size:20px;min-height:28px;margin-top:6px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}

.feedback{display:none;margin-top:18px;background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:14px 18px;
  box-shadow:0 7px 0 var(--ink);align-items:center;gap:14px;flex-wrap:wrap}
.feedback.show{display:flex}
.feedback.good{background:var(--leaf-l)} .feedback.bad{background:var(--tomato-l)}
.fb-text{flex:1;min-width:200px}
.fb-title{font-size:28px;font-weight:800;line-height:1.1}
.fb-word{font-size:22px} .fb-word b{font-size:30px}

/* Résultats */
.result{text-align:center;padding-top:30px}
.result h2{font-size:44px;margin:0;line-height:1.1}
.big-stars{font-size:90px;margin:16px 0 4px;letter-spacing:10px}
.big-stars span{display:inline-block;color:#C9D3E6}
.big-stars span.on{color:var(--sun);animation:pop .4s ease-out both;text-shadow:0 5px 0 var(--sun-d)}
.score-line{font-size:30px;font-weight:700}
.unlock{display:inline-block;margin-top:14px;background:var(--sky);color:#fff;border-radius:16px;padding:8px 18px;font-size:22px;font-weight:700}
.new-badges{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.result .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px}

/* Fenêtres */
.overlay{display:none;position:fixed;inset:0;background:rgba(28,43,90,.55);z-index:20;padding:20px;overflow:auto}
.overlay.show{display:block}
.sheet{background:var(--card);border:4px solid var(--ink);border-radius:28px;max-width:720px;margin:20px auto;padding:20px 22px;
  box-shadow:0 10px 0 var(--ink)}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h3{flex:1;margin:0;font-size:30px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{border:3px solid var(--ink);border-radius:20px;padding:12px;text-align:center;background:#FFF6D9}
.badge .e{font-size:52px;line-height:1.1}
.badge b{display:block;font-size:19px;line-height:1.1}
.badge small{font-size:15px;color:var(--ink2);line-height:1.2;display:block}
.badge.off{background:#EEF2F9;border-color:#A9B5CF}
.badge.off .e{filter:grayscale(1);opacity:.35}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--paper);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:30px;line-height:1}
.stat small{font-size:15px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{text-align:left;padding:6px 6px;border-bottom:2px solid #E6ECF7}
th{color:var(--ink2);font-weight:500}
.pct{font-weight:700} .pct.g{color:var(--leaf)} .pct.r{color:var(--tomato)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tag{background:var(--tomato-l);border-radius:12px;padding:4px 10px;font-size:18px}
.gate{text-align:center;font-size:24px}
.gate input{font-family:inherit;font-size:30px;width:130px;text-align:center;border:4px solid var(--ink);border-radius:16px;padding:4px}
a{color:var(--sky-d)}

#loading{display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;background:rgba(242,247,255,.7);font-size:70px}
#loading.show{display:flex}
#loading span{animation:bounce .6s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-24px)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;
  padding:10px 18px;font-size:20px;display:none;z-index:40;max-width:90vw;text-align:center}
#toast.show{display:block}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:560px){.hello{font-size:26px}.stone{width:88px;height:88px;font-size:38px}.opt{font-size:28px}}
</style>
</head>
<body>

<!-- Accueil : carte d'aventure -->
<section id="home" class="screen active">
  <div class="top">
    <h1 class="hello"><span id="helloName">Hello!</span><small>Choisis ta prochaine étape sur le chemin</small></h1>
    <button class="chip star" id="starChip" aria-label="Mes étoiles">★ <span id="starCount">0</span></button>
    <button class="chip icon-btn" id="badgeBtn" aria-label="Mes badges">🏅</button>
    <button class="chip icon-btn" id="muteBtn" aria-label="Couper le son">🔊</button>
    <button class="chip icon-btn" id="parentBtn" aria-label="Espace parents">👪</button>
  </div>
  <div id="map"></div>
</section>

<!-- Partie en cours -->
<section id="game" class="screen">
  <div class="game-top">
    <button class="chip icon-btn" id="quitBtn" aria-label="Retour à la carte">✕</button>
    <div class="dots" id="dots"></div>
  </div>
  <div class="picto-card" id="picto"></div>
  <p class="question" id="question"></p>
  <div id="answerZone"></div>
  <div class="feedback" id="feedback">
    <div class="fb-text">
      <div class="fb-title" id="fbTitle"></div>
      <div class="fb-word" id="fbWord"></div>
    </div>
    <button class="chip icon-btn" id="sayBtn" aria-label="Écouter le mot">🔊</button>
    <button class="big-btn" id="nextBtn">Suivant</button>
  </div>
</section>

<!-- Résultat -->
<section id="result" class="screen">
  <div class="result">
    <h2 id="resTitle"></h2>
    <div class="big-stars" id="resStars"><span>★</span><span>★</span><span>★</span></div>
    <div class="score-line" id="resScore"></div>
    <div id="resUnlock"></div>
    <div class="new-badges" id="resBadges"></div>
    <div class="actions">
      <button class="big-btn light" id="replayBtn">Rejouer</button>
      <button class="big-btn green" id="backBtn">Retour à la carte</button>
    </div>
  </div>
</section>

<!-- Badges -->
<div class="overlay" id="badgesOv">
  <div class="sheet">
    <div class="sheet-head"><h3>Mes badges</h3><button class="chip icon-btn" data-close aria-label="Fermer">✕</button></div>
    <div class="badge-grid" id="badgeGrid"></div>
  </div>
</div>

<!-- Parents -->
<div class="overlay" id="parentOv">
  <div class="sheet">
    <div class="sheet-head"><h3>Espace parents</h3><button class="chip icon-btn" data-close aria-label="Fermer">✕</button></div>
    <div id="parentBody"></div>
  </div>
</div>

<script src="config.js"></script>
<div id="loading"><span>🎒</span></div>
<div id="toast"></div>

<script>
/* L'adresse de l'API est dans config.js (fichier séparé, jamais écrasé par les mises à jour) */
const API_URL = String(window.JULES_API_URL || '').trim();

const S = { app:null, cache:{}, muted:false, game:null };
const $ = s => document.querySelector(s);
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
async function call(action, params={}, post=false){
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL))
    throw new Error('Adresse de l\'API manquante ou invalide : vérifie le fichier config.js à côté de index.html.');
  let res;
  try{
    if(post){
      res = await fetch(API_URL, { method:'POST', credentials:'omit', redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ action, ...params }) });
    } else {
      res = await fetch(API_URL+'?'+new URLSearchParams({ action, ...params }), { credentials:'omit', redirect:'follow' });
    }
  }catch(e){ throw new Error('Pas de connexion à Internet, ou API inaccessible.'); }
  let j;
  try{ j = await res.json(); }
  catch(e){ throw new Error('Réponse inattendue de l\'API. Vérifie que le déploiement est en accès « Tout le monde ».'); }
  if(!j.ok) throw new Error(j.error || 'Erreur inconnue');
  return j.data;
}
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id===id)); window.scrollTo(0,0); }
function loading(on){ $('#loading').classList.toggle('show', on); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function starsTxt(n){ return '★'.repeat(n)+'☆'.repeat(3-n); }

/* ---------- Sons et voix ---------- */
let AC;
function tone(f,d,when=0,type='sine',vol=.18){
  if(S.muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.05);
  }catch(e){}
}
const sfx = {
  ok(){ tone(660,.15); tone(990,.28,.12); },
  ko(){ tone(200,.28,0,'triangle',.16); },
  star(i){ tone(523*Math.pow(1.26,i),.35,0,'sine',.2); },
  fanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f,.32,i*.13,'square',.08)); }
};
function speak(text){
  if(S.muted || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text), lang=(S.app&&S.app.config.voix)||'en-GB';
    const voices=speechSynthesis.getVoices();
    u.voice = voices.find(v=>v.lang.replace('_','-')===lang) || voices.find(v=>v.lang.startsWith('en')) || null;
    u.lang=lang; u.rate=.85; speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Démarrage ---------- */
async function init(){
  loading(true);
  try{ S.app = await call('getAppData'); renderHome(); }
  catch(e){ showLoadError(e); }
  loading(false);
}

function showLoadError(e){
  const map=$('#map'); map.innerHTML=''; map.style.height='auto';
  const box=el('div','sheet');
  box.appendChild(el('h3',null,'⚠️ Impossible de charger les données'));
  const msg=el('p',null,(e && e.message) ? e.message : String(e));
  msg.style.cssText='font-size:20px;color:var(--tomato);word-break:break-word';
  box.appendChild(msg);
  box.appendChild(el('p',null,'Vérifie la connexion Internet, puis que setup a bien été exécuté et que l\'API est déployée en accès « Tout le monde ».'));
  const retry=el('button','big-btn','Réessayer'); retry.onclick=init;
  box.appendChild(retry);
  map.appendChild(box);
}

function renderHome(){
  $('#helloName').textContent = 'Hello ' + S.app.config.prenom + ' !';
  $('#starCount').textContent = S.app.totalStars;
  renderMap();
}

function renderMap(){
  const map=$('#map'); map.innerHTML='';
  const nodes=[];
  S.app.modules.forEach(m=>{ nodes.push({m,p:'qcm'}); nodes.push({m,p:'saisie'}); });
  nodes.push({end:true});

  const W=map.clientWidth||600, step=170, H=nodes.length*step+30;
  map.style.height=H+'px';
  const pts=nodes.map((n,i)=>({ x: W*(i%2 ? .70 : .30), y: 80+i*step }));

  const NS='http://www.w3.org/2000/svg', svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=1;i<pts.length;i++) d+=` C${pts[i-1].x},${pts[i-1].y+step*.6} ${pts[i].x},${pts[i].y-step*.6} ${pts[i].x},${pts[i].y}`;
  const path=document.createElementNS(NS,'path');
  path.setAttribute('d',d); path.setAttribute('fill','none'); path.setAttribute('stroke','#1C2B5A');
  path.setAttribute('stroke-width','6'); path.setAttribute('stroke-dasharray','2 16'); path.setAttribute('stroke-linecap','round');
  svg.appendChild(path); map.appendChild(svg);

  let currentIdx=-1;
  nodes.forEach((n,i)=>{ if(!n.end && n.m[n.p].unlocked) currentIdx=i; });

  nodes.forEach((n,i)=>{
    const pt=pts[i], b=el('button','stone'), cap=el('div','stone-cap');
    b.style.left=pt.x+'px'; b.style.top=pt.y+'px';
    cap.style.left=pt.x+'px'; cap.style.top=(pt.y+62)+'px';
    if(n.end){
      b.textContent='🎁'; b.classList.add('locked');
      b.setAttribute('aria-label','Prochain module bientôt');
      cap.appendChild(el('b',null,'Bientôt…'));
      b.onclick=()=>toast('Un nouveau module arrive bientôt !');
    } else {
      const st=n.m[n.p];
      b.textContent = st.unlocked ? (n.p==='qcm' ? '👆' : '✍️') : '🔒';
      if(!st.unlocked) b.classList.add('locked');
      else if(st.best>=S.app.config.seuil) b.classList.add('done');
      if(i===currentIdx) b.classList.add('current');
      const label = n.p==='qcm' ? 'Choisis le mot' : 'Écris le mot';
      b.setAttribute('aria-label', n.m.titre+' : '+label);
      cap.appendChild(el('b',null,label));
      if(st.unlocked) cap.appendChild(el('span',null,starsTxt(st.stars)));
      b.onclick=()=>{
        if(st.unlocked) startGame(n.m,n.p);
        else { sfx.ko(); b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400);
               toast('Fais au moins '+S.app.config.seuil+' % à l\'étape d\'avant !'); }
      };
      if(n.p==='qcm'){
        const ban=el('div','banner');
        ban.appendChild(el('b',null,(n.m.emoji||'')+' '+n.m.titre));
        ban.appendChild(el('small',null,n.m.titre_fr+' · '+n.m.nbMots+' mots'));
        ban.style.top=(pt.y+step/2)+'px';
        if(i%2){ ban.style.left='16px'; } else { ban.style.right='16px'; }
        map.appendChild(ban);
      }
    }
    map.appendChild(b); map.appendChild(cap);
  });
}

/* ---------- Partie ---------- */
async function startGame(m,p){
  try{
    if(!S.cache[m.id]){ loading(true); S.cache[m.id]=await call('getModuleWords',{ moduleId:m.id }); }
  }catch(e){ loading(false); toast(e.message||'Erreur de chargement'); return; }
  loading(false);
  const words=S.cache[m.id];
  if(words.length<3){ toast('Il faut au moins 3 mots dans ce module.'); return; }
  const n=Math.min(S.app.config.nb_questions, words.length);
  S.game={ m, p, words, deck:shuffle(words).slice(0,n), i:0, score:0, errors:[], results:[], t0:Date.now() };
  show('game'); renderQuestion();
}

function renderDots(){
  const g=S.game, box=$('#dots'); box.innerHTML='';
  g.deck.forEach((_,i)=>{
    const d=el('div','dot');
    if(i<g.results.length) d.classList.add(g.results[i]?'ok':'ko');
    else if(i===g.i) d.classList.add('now');
    box.appendChild(d);
  });
}

function renderQuestion(){
  const g=S.game, w=g.deck[g.i];
  g.answered=false; g.tries=0;
  renderDots();
  const pic=$('#picto'); pic.textContent=w.picto; pic.classList.remove('pop'); void pic.offsetWidth; pic.classList.add('pop');
  $('#feedback').className='feedback';
  const zone=$('#answerZone'); zone.innerHTML='';

  if(g.p==='qcm'){
    $('#question').textContent='Which verb is it?';
    const others=shuffle(g.words.filter(x=>x.en!==w.en)).slice(0,2);
    const box=el('div','options');
    shuffle([w,...others]).forEach(o=>{
      const b=el('button','opt',o.en); b.dataset.en=o.en;
      b.onclick=()=>answerQcm(b,o,w);
      box.appendChild(b);
    });
    zone.appendChild(box);
  } else {
    $('#question').textContent='Write the verb!';
    const row=el('div','write-row');
    const inp=el('input'); inp.id='typed';
    Object.assign(inp,{type:'text',autocomplete:'off',spellcheck:false,placeholder:'…'});
    inp.setAttribute('autocapitalize','off'); inp.setAttribute('autocorrect','off'); inp.setAttribute('aria-label','Écris le verbe en anglais');
    const go=el('button','big-btn green','OK');
    row.append(inp,go); zone.appendChild(row);
    zone.appendChild(el('div','hint')).id='hint';
    zone.appendChild(el('div','err')).id='err';
    go.onclick=()=>checkTyped(w);
    inp.onkeydown=e=>{ if(e.key==='Enter') checkTyped(w); };
    inp.oninput=()=>{ $('#err').textContent=''; inp.classList.remove('ko'); };
    setTimeout(()=>inp.focus(),300);
  }
}

function answerQcm(btn,choice,w){
  const g=S.game; if(g.answered) return; g.answered=true;
  const good = choice.en===w.en;
  document.querySelectorAll('.opt').forEach(b=>{
    if(b.dataset.en===w.en) b.classList.add('ok'); else if(b!==btn) b.classList.add('dim');
  });
  if(!good){ btn.classList.add('ko'); }
  finishQuestion(good,w);
}

function normalize(s){ return String(s).toLowerCase().trim().replace(/\s+/g,' ').replace(/^to /,'').replace(/[.!?]/g,''); }

function checkTyped(w){
  const g=S.game; if(g.answered) return;
  const inp=$('#typed'), val=normalize(inp.value);
  if(!val){ $('#err').textContent='Écris un mot d\'abord'; inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400); return; }
  const accepted=[w.en,...w.variantes].map(normalize);
  if(accepted.includes(val)){
    g.answered=true; inp.classList.add('ok'); inp.disabled=true; $('#hint').textContent='';
    finishQuestion(true,w);
    return;
  }
  g.tries++;
  inp.classList.add('ko','shake'); setTimeout(()=>inp.classList.remove('shake'),400);
  if(g.tries===1){
    sfx.ko();
    $('#hint').textContent = w.en[0] + ' ' + '_ '.repeat(w.en.length-1).trim();
    $('#err').textContent='Presque ! Regarde l\'indice et réessaie';
    inp.select();
  } else {
    g.answered=true; inp.disabled=true; $('#err').textContent='';
    $('#hint').textContent=w.en.split('').join(' ');
    finishQuestion(false,w);
  }
}

function finishQuestion(good,w){
  const g=S.game;
  g.results.push(good);
  if(good) g.score++; else g.errors.push(w.en);
  good ? sfx.ok() : sfx.ko();
  setTimeout(()=>speak(w.en), 350);
  renderDots();
  const praise=['Bravo !','Super !','Génial !','Well done!','Great!'];
  $('#fbTitle').textContent = good ? praise[Math.floor(Math.random()*praise.length)] : 'Pas grave, retiens bien :';
  const fw=$('#fbWord'); fw.innerHTML='';
  fw.appendChild(el('b',null,w.en)); fw.appendChild(document.createTextNode('  =  🇫🇷 '+w.fr));
  $('#feedback').className='feedback show '+(good?'good':'bad');
  $('#sayBtn').onclick=()=>speak(w.en);
  $('#nextBtn').textContent = g.i===g.deck.length-1 ? 'Voir mon score' : 'Suivant';
  setTimeout(()=>$('#nextBtn').focus(),50);
}

$('#nextBtn').onclick=()=>{
  const g=S.game;
  if(g.i<g.deck.length-1){ g.i++; renderQuestion(); } else endGame();
};
$('#quitBtn').onclick=()=>{ if(confirm('Quitter la partie ? Ton score ne sera pas gardé.')){ show('home'); renderMap(); } };

async function endGame(){
  const g=S.game;
  loading(true);
  let res;
  try{
    res=await call('saveScore',{ payload:{ moduleId:g.m.id, partie:g.p, score:g.score, total:g.deck.length,
      duree:Math.round((Date.now()-g.t0)/1000), erreurs:g.errors } }, true);
    S.app=res.app;
  }catch(e){
    loading(false); toast('Score non enregistré : '+(e.message||'erreur')); show('home'); renderHome(); return;
  }
  loading(false);
  show('result');
  const titles=['On réessaie ?','Bien joué !','Très bien !','Parfait, champion !'];
  $('#resTitle').textContent=titles[res.stars];
  $('#resScore').textContent=g.score+' / '+g.deck.length+' bonnes réponses';
  const stars=[...document.querySelectorAll('#resStars span')];
  stars.forEach(s=>s.classList.remove('on'));
  stars.forEach((s,i)=>{ if(i<res.stars) setTimeout(()=>{ s.classList.add('on'); sfx.star(i); }, 400+i*450); });
  if(res.stars===3) setTimeout(sfx.fanfare, 400+3*450);

  const un=$('#resUnlock'); un.innerHTML='';
  if(res.nouvelleEtape) un.appendChild(el('div','unlock','🔓 Nouvelle étape débloquée !'));
  const nb=$('#resBadges'); nb.innerHTML='';
  res.nouveauxBadges.forEach(b=>nb.appendChild(badgeCard(b,true)));
  $('#starCount').textContent=S.app.totalStars;
}
$('#replayBtn').onclick=()=>{ const g=S.game; const m=S.app.modules.find(x=>x.id===g.m.id)||g.m; startGame(m,g.p); };
$('#backBtn').onclick=()=>{ show('home'); renderHome(); };

/* ---------- Badges ---------- */
function badgeCard(b,isNew){
  const c=el('div','badge'+(b.obtenu?'':' off'));
  c.appendChild(el('div','e',b.emoji));
  c.appendChild(el('b',null,(isNew?'Nouveau ! ':'')+b.nom));
  c.appendChild(el('small',null,b.description));
  return c;
}
function openBadges(){
  const grid=$('#badgeGrid'); grid.innerHTML='';
  S.app.badges.forEach(b=>grid.appendChild(badgeCard(b,false)));
  $('#badgesOv').classList.add('show');
}
$('#badgeBtn').onclick=openBadges;
$('#starChip').onclick=openBadges;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.overlay').classList.remove('show'));

$('#muteBtn').onclick=()=>{
  S.muted=!S.muted; $('#muteBtn').textContent=S.muted?'🔇':'🔊';
  if(S.muted && 'speechSynthesis' in window) speechSynthesis.cancel();
};

/* ---------- Espace parents ---------- */
$('#parentBtn').onclick=()=>{
  const body=$('#parentBody'); body.innerHTML='';
  const gate=el('div','gate');
  gate.appendChild(el('p',null,'Code parent'));
  const inp=el('input'); inp.type='password'; inp.inputMode='numeric'; inp.autocomplete='off';
  inp.setAttribute('aria-label','Code parent');
  const ok=el('button','big-btn','Entrer'); ok.style.marginLeft='10px';
  const err=el('div','err');
  gate.append(inp,ok,err); body.appendChild(gate);
  const check=()=>{ if(!inp.value.trim()){ err.textContent='Saisis le code d\'abord'; return; } loadParent(inp.value.trim(), err); };
  ok.onclick=check; inp.onkeydown=e=>{ if(e.key==='Enter') check(); }; inp.oninput=()=>{ err.textContent=''; };
  $('#parentOv').classList.add('show'); setTimeout(()=>inp.focus(),100);
};

async function loadParent(code, errBox){
  loading(true);
  let st; try{ st=await call('getParentStats',{ code }, true); }
  catch(e){ loading(false); if(errBox) errBox.textContent=e.message||'Erreur'; return; }
  loading(false);
  const body=$('#parentBody'); body.innerHTML='';
  const stats=el('div','stats');
  [[st.nbParties,'parties'],[st.moyenne+' %','moyenne'],[st.minutes+' min','de jeu']].forEach(([v,l])=>{
    const s=el('div','stat'); s.appendChild(el('b',null,String(v))); s.appendChild(el('small',null,l)); stats.appendChild(s);
  });
  body.appendChild(stats);
  body.appendChild(el('b',null,'Mots les plus difficiles'));
  const tags=el('div','tags');
  if(!st.motsDifficiles.length) tags.appendChild(el('span',null,'Aucune erreur pour l\'instant.'));
  st.motsDifficiles.forEach(m=>tags.appendChild(el('span','tag',m.mot+' ×'+m.erreurs)));
  body.appendChild(tags);
  body.appendChild(el('b',null,'Dernières parties'));
  const t=el('table'), hr=el('tr');
  ['Date','Module','Étape','Score','Erreurs'].forEach(h=>hr.appendChild(el('th',null,h)));
  t.appendChild(hr);
  st.dernieres.forEach(r=>{
    const tr=el('tr');
    tr.appendChild(el('td',null,r.date)); tr.appendChild(el('td',null,r.module)); tr.appendChild(el('td',null,r.partie));
    tr.appendChild(el('td','pct '+(r.pct>=S.app.config.seuil?'g':'r'),r.score+' ('+r.pct+' %)'));
    tr.appendChild(el('td',null,r.erreurs||'—'));
    t.appendChild(tr);
  });
  const wrap=el('div'); wrap.style.overflowX='auto'; wrap.appendChild(t); body.appendChild(wrap);
  const link=el('a',null,'Ouvrir la base de données (Google Sheet)'); link.href=st.dbUrl; link.target='_blank';
  const p=el('p'); p.appendChild(link); body.appendChild(p);
}

window.addEventListener('resize',()=>{ if(S.app && $('#home').classList.contains('active')) renderMap(); });
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};
init();
</script>
