<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F7FF">
<title>Jules English Adventure</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎒</text></svg>">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    font-family:ui-rounded,system-ui,sans-serif;color:#1C2B5A;background:#F2F7FF;text-align:center;padding:20px}
  .bag{font-size:80px;animation:b .6s ease-in-out infinite alternate}
  @keyframes b{to{transform:translateY(-24px)}}
  @media (prefers-reduced-motion:reduce){.bag{animation:none}}
  .err{display:none;max-width:520px;font-size:20px}
  button{font:inherit;font-size:24px;font-weight:700;color:#fff;background:#3D7BF7;border:4px solid #1C2B5A;border-radius:20px;padding:8px 22px;cursor:pointer}
</style>
</head>
<body>
<div class="bag" id="bag">🎒</div>
<div class="err" id="err">
  <p><b>L’appli ne répond pas.</b><br><span id="msg"></span></p>
  <button onclick="location.reload()">Réessayer</button>
</div>
<script>
// ====== Seule chose à personnaliser : l'URL /exec de ton Apps Script ======
const API_URL = 'https://script.google.com/macros/s/AKfycbwBfHW6jfzy_9Lg_tLG2IuImmUEw-eo2frUZp42NRSr7QsYbGJrZ-GjE8OSK5aDkWK5/exec';
// ==========================================================================

(async () => {
  try {
    const res = await fetch(API_URL + '?action=getUi', { credentials: 'omit', redirect: 'follow' });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Erreur inconnue');
    const html = j.data.split('__JULES_API_URL__').join(API_URL);
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById('bag').style.display = 'none';
    document.getElementById('err').style.display = 'block';
    document.getElementById('msg').textContent = (e && e.message && !/fetch|JSON|Unexpected/i.test(e.message))
      ? e.message
      : 'Vérifie la connexion Internet, l’URL /exec dans index.html et le déploiement Apps Script (accès « Tout le monde »).';
  }
})();
</script>
</body>
</html>
